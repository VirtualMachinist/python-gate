[project]
name = "python-gate"
version = "0.1.0"
description = "Closed-world Python: Nix is the gate, uv owns the expression"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hedronite" }]
dependencies = [
    "rich>=13",
]

[project.scripts]
python-gate = "python_gate:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"
